name: Build Docker image

on:
  push:
    branches: [server, main]
  workflow_dispatch:

# Needed to push to GitHub Container Registry (ghcr.io) using the built-in
# GITHUB_TOKEN — no extra registry secrets required.
permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: [self-hosted, Linux, docker, buildx]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags: "latest" (always the newest build of main) plus the short commit SHA
      # (so a specific build can be pinned/rolled back to).
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Single multi-arch build on our own self-hosted box, same pattern as
      # KitsuNexus's Linux Electron builds (NODEJS/.github/workflows/build.yml) —
      # one machine cross-builds both architectures via QEMU instead of needing a
      # separate arm64 runner.
      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
