name: Build KitsuNexus Server Docker

on:
  workflow_dispatch:
    inputs:
      runner_type:
        description: 'Runner pool'
        type: choice
        required: true
        default: github-hosted
        options:
          - github-hosted
          - self-hosted
      push_image:
        description: 'Publish the AMD64/ARM64 image to GitHub Container Registry'
        type: boolean
        required: true
        default: false

# The package permission is used only when publishing is explicitly selected.
permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build Docker (amd64 + arm64)
    runs-on: ${{ inputs.runner_type == 'self-hosted' && fromJSON('["self-hosted","Linux","docker","buildx"]') || 'ubuntu-24.04' }}
    timeout-minutes: 120
    steps:
      # The backend lives on the server branch. This workflow also exists on
      # the default main branch so Actions displays a Run workflow button.
      - name: Checkout server source
        uses: actions/checkout@v4
        with:
          ref: server

      - name: Log in to GitHub Container Registry
        if: ${{ inputs.push_image }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tag the actual server commit rather than the main workflow commit.
      - name: Set image tags
        id: meta
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          {
            echo 'tags<<EOF'
            echo "${image}:latest"
            echo "${image}:sha-$(git rev-parse --short=7 HEAD)"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # No image or cache is published for a build-only run.
      - name: Build and optionally publish (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ inputs.push_image }}
          tags: ${{ steps.meta.outputs.tags }}
