name: Build KitsuNexus Server Docker

on:
  workflow_dispatch:
    inputs:
      runner_type:
        description: 'Runner pool (self-hosted requires Linux X64 and ARM64 docker/buildx runners)'
        type: choice
        required: true
        default: github-hosted
        options:
          - github-hosted
          - self-hosted
      push_image:
        description: 'Publish the AMD64/ARM64 image to GitHub Container Registry'
        type: boolean
        required: true
        default: false

permissions:
  contents: read
  packages: write

jobs:
  resolve-server:
    name: Resolve server source
    runs-on: ubuntu-24.04
    outputs:
      server_sha: ${{ steps.refs.outputs.server_sha }}
      server_short_sha: ${{ steps.refs.outputs.server_short_sha }}
      image: ${{ steps.refs.outputs.image }}
    steps:
      # Pin both builds to the same server commit, even if the branch advances.
      - name: Checkout server source
        uses: actions/checkout@v4
        with:
          ref: server

      - name: Resolve source and image
        id: refs
        shell: bash
        run: |
          echo "server_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "server_short_sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

  build:
    name: Build Docker (${{ matrix.arch }})
    needs: resolve-server
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            hosted_runner: ubuntu-24.04
            self_hosted_arch: X64
          - arch: arm64
            platform: linux/arm64
            hosted_runner: ubuntu-24.04-arm
            self_hosted_arch: ARM64
    # Build native binaries on the matching CPU architecture (no QEMU).
    # Self-hosted runs require both runner architectures, each with docker/buildx labels.
    runs-on: ${{ inputs.runner_type == 'self-hosted' && fromJSON(format('["self-hosted","Linux","docker","buildx","{0}"]', matrix.self_hosted_arch)) || matrix.hosted_runner }}
    timeout-minutes: 60
    steps:
      - name: Checkout pinned server source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-server.outputs.server_sha }}

      - name: Log in to GitHub Container Registry
        if: ${{ inputs.push_image }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build-only runs do not push images or upload workflow artifacts.
      - name: Build ${{ matrix.platform }}
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: ${{ inputs.push_image }}
          tags: ${{ needs.resolve-server.outputs.image }}:sha-${{ needs.resolve-server.outputs.server_short_sha }}-${{ matrix.arch }}

  publish-manifest:
    name: Publish multi-architecture image
    if: ${{ inputs.push_image }}
    needs: [resolve-server, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Publish and verify multi-architecture tags
        shell: bash
        env:
          IMAGE: ${{ needs.resolve-server.outputs.image }}
          SHORT_SHA: ${{ needs.resolve-server.outputs.server_short_sha }}
        run: |
          docker buildx imagetools create \
            --tag "${IMAGE}:latest" \
            --tag "${IMAGE}:sha-${SHORT_SHA}" \
            "${IMAGE}:sha-${SHORT_SHA}-amd64" \
            "${IMAGE}:sha-${SHORT_SHA}-arm64"
          docker buildx imagetools inspect "${IMAGE}:sha-${SHORT_SHA}"
