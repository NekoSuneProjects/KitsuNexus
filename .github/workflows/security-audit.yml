name: Server security audit

on:
  push:
    branches: [server]
  pull_request:
    branches: [server]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Validate lockfile and dependencies
        run: npm ci --ignore-scripts
      - name: Audit npm dependencies
        id: npm_audit
        continue-on-error: true
        run: |
          npm audit --json > npm-audit.json || test -s npm-audit.json
      - name: Scan dependency lockfile with OSV
        id: osv
        continue-on-error: true
        uses: google/osv-scanner-action/osv-scanner-action@v2.3.1
        with:
          scan-args: |-
            scan
            --format=json
            --output=osv-results.json
            --lockfile=package-lock.json
      - name: Install Gitleaks
        run: |
          curl --fail --location --retry 3 --silent --show-error https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
      - name: Scan current server files for secrets
        id: gitleaks
        continue-on-error: true
        run: /tmp/gitleaks dir . --redact --report-format json --report-path gitleaks-results.json --exit-code 1
      - name: Build actionable security report
        if: always()
        env:
          NPM_OUTCOME: ${{ steps.npm_audit.outcome }}
          OSV_OUTCOME: ${{ steps.osv.outcome }}
          SECRET_OUTCOME: ${{ steps.gitleaks.outcome }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          lines = ['## Server security audit', '', '**Branch:** `' + os.environ.get('GITHUB_HEAD_REF','server') + '`  |  **Commit:** `' + os.environ['GITHUB_SHA'][:12] + '`  |  **Run:** `' + os.environ['GITHUB_RUN_ID'] + '`', '']
          lines += ['**npm audit:** ' + os.environ['NPM_OUTCOME'] + '  |  **OSV:** ' + os.environ['OSV_OUTCOME'] + '  |  **Secret scan:** ' + os.environ['SECRET_OUTCOME'], '']
          lines += ['### Vulnerable dependencies', '', '| Package | Installed | Advisory | Severity | Recommended fix |', '|---|---|---|---|---|']
          count = 0
          try:
              data = json.loads(pathlib.Path('npm-audit.json').read_text())
              for name, item in data.get('vulnerabilities', {}).items():
                  count += 1
                  via = item.get('via', [])
                  advisory = next((str(v.get('url') or v.get('name') or 'See npm audit') for v in via if isinstance(v, dict)), 'See npm audit')
                  fix = item.get('fixAvailable')
                  fixtext = (str(fix.get('version')) if isinstance(fix, dict) else ('npm audit fix' if fix else 'Review advisory'))
                  installed = item.get('range', '—')
                  safe = lambda v: str(v).replace('|', '\\|').replace('\\n',' ')[:150]
                  lines.append('| ' + ' | '.join(map(safe,[name,installed,advisory,item.get('severity','unknown'),fixtext])) + ' |')
              if not count: lines.append('| No npm audit findings | — | — | — | — |')
          except Exception as exc:
              lines.append('| npm audit report unavailable | — | Check workflow logs | — | — |')
          lines += ['', '### OSV dependency scan', '']
          try:
              data = json.loads(pathlib.Path('osv-results.json').read_text())
              findings = [(p.get('package',{}).get('name','unknown'), v.get('id','unknown')) for result in data.get('results',[]) for p in result.get('packages',[]) for v in p.get('vulnerabilities',[])]
              lines.append(str(len(findings)) + ' OSV advisory finding(s).')
              for pkg, adv in findings[:30]:
                  lines.append('- `' + str(pkg).replace('`','') + '`: [' + str(adv) + '](https://osv.dev/vulnerability/' + str(adv) + ')')
          except Exception:
              lines.append('OSV JSON report unavailable; check workflow logs (not a clean scan).')
          lines += ['', '### Secret scan', '']
          try:
              leaks = json.loads(pathlib.Path('gitleaks-results.json').read_text())
              lines.append(str(len(leaks or [])) + ' potential secret finding(s). Secret values are never posted here.')
              for leak in (leaks or [])[:15]:
                  lines.append('- ' + str(leak.get('RuleID','unknown')) + ' in `' + str(leak.get('File','unknown')).replace('`','') + '` line ' + str(leak.get('StartLine','?')))
          except Exception:
              lines.append('Secret report unavailable; scan status: **' + os.environ['SECRET_OUTCOME'] + '**.')
          lines += ['', '[View workflow logs](https://github.com/' + os.environ['GITHUB_REPOSITORY'] + '/actions/runs/' + os.environ['GITHUB_RUN_ID'] + ')']
          pathlib.Path('security-comment.md').write_text('\n'.join(lines) + '\n')
          PY
      - name: Upload detailed audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-security-reports
          path: |
            npm-audit.json
            osv-results.json
            gitleaks-results.json
            security-comment.md
          if-no-files-found: ignore
      - name: Post complete security report on PR
        if: ${{ always() && github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR_NUMBER" --body-file security-comment.md
      - name: Fail on vulnerability or secret scan findings
        if: ${{ always() && (steps.npm_audit.outcome != 'success' || steps.osv.outcome != 'success' || steps.gitleaks.outcome != 'success') }}
        run: exit 1
