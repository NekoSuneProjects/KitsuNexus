name: PR security audit
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  pull-requests: write
jobs:
  scan:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Scan dependencies with OSV
        id: osv
        continue-on-error: true
        uses: google/osv-scanner-action/osv-scanner-action@v2.3.1
        with:
          scan-args: |-
            scan
            --recursive
            ./
      - name: Scan secrets with Gitleaks
        id: gitleaks
        if: always()
        continue-on-error: true
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Comment only when scanners fail
        if: ${{ always() && (steps.osv.outcome == 'failure' || steps.gitleaks.outcome == 'failure') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          OSV_OUTCOME: ${{ steps.osv.outcome }}
          GITLEAKS_OUTCOME: ${{ steps.gitleaks.outcome }}
        run: |
          {
            echo '## Security audit — needs attention'
            echo ''
            echo "- Dependency scan: $OSV_OUTCOME"
            echo "- Secret scan: $GITLEAKS_OUTCOME"
            echo ''
            echo "See [the workflow run](https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) for details."
            echo 'GitHub Actions detected a security scan failure. Please review and fix the findings or workflow error before merging. Do not post secret values.'
          } > /tmp/security-comment.md
          gh pr comment "$PR_NUMBER" --body-file /tmp/security-comment.md
      - name: Fail checks if scans failed
        if: ${{ always() && (steps.osv.outcome == 'failure' || steps.gitleaks.outcome == 'failure') }}
        run: exit 1
