name: Server security audit

on:
  push:
    branches: [server]
  pull_request:
    branches: [server]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Validate lockfile and dependencies
        run: npm ci --ignore-scripts
      - name: Audit npm dependencies
        run: npm audit --audit-level=high
      - name: Scan dependency lockfile with OSV
        uses: google/osv-scanner-action/osv-scanner-action@v2.3.1
        with:
          scan-args: |-
            scan
            --lockfile=package-lock.json
      - name: Install Gitleaks
        run: |
          curl --fail --location --retry 3 --silent --show-error https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
      - name: Scan current server files for secrets
        id: gitleaks
        continue-on-error: true
        run: /tmp/gitleaks dir . --redact --report-format json --report-path gitleaks-results.json --exit-code 1
      - name: Post security report on PR
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: actions/github-script@v7
        env:
          GITLEAKS_OUTCOME: ${{ steps.gitleaks.outcome }}
        with:
          script: |
            const status = process.env.GITLEAKS_OUTCOME;
            const body = [
              '## Server security audit',
              '**Branch:** `' + context.payload.pull_request.head.ref + '` | **Commit:** `' + context.payload.pull_request.head.sha.slice(0,12) + '` | **Run:** `' + context.runId + '`',
              '**Current-file secret scan:** ' + (status === 'success' ? 'passed' : 'failed'),
              'Dependency and npm audit results are available in the workflow logs.',
              '[View scan](https://github.com/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId + ')'
            ].join('\\n\\n');
            await github.rest.issues.createComment({...context.repo, issue_number: context.issue.number, body});
      - name: Fail on secret findings
        if: ${{ always() && steps.gitleaks.outcome != 'success' }}
        run: exit 1
