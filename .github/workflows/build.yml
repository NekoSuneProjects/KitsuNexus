name: Build NekoSuneAPPSVRC

on:
  push:
    tags:
      - 'v*'

# softprops/action-gh-release needs write access to create the release + upload assets.
permissions:
  contents: write

jobs:
  detect-runners:
    # Any online self-hosted runner is preferred over GitHub-hosted ones,
    # matched generically by OS (and, for the Linux matrix, by X64/ARM64
    # arch labels) rather than by name - currently nekorpi1 (Linux ARM64) and
    # vmi555990 (Linux X64), but adding/renaming/replacing runners later, or
    # adding a self-hosted Windows box, needs no workflow edit. GitHub
    # Actions has no native "try self-hosted, else hosted": a job queued for
    # an offline self-hosted runner just waits forever (timeout-minutes only
    # starts counting once a runner picks the job up, not while it's
    # queued), so this job checks runner status via the API first and hands
    # the actual runs-on labels down to every other job through its outputs.
    # Every other job now depends on this one (previously build-and-release
    # ran in parallel with it) so its own runs-on can be resolved first - the
    # cost is a small serial delay (this is just an API call, seconds) in
    # exchange for the Windows job also getting self-hosted routing.
    #
    # Requires a repo secret RUNNER_STATUS_PAT: a PAT (classic with the "repo"
    # scope covering org runner read access, or fine-grained with the org's
    # "Self-hosted runners: Read" permission) - the default GITHUB_TOKEN can't
    # call the org runners API. If the secret is missing or the call fails,
    # this falls back to GitHub-hosted runners across the board rather than
    # failing the whole release.
    runs-on: ubuntu-latest
    outputs:
      x64_runner: ${{ steps.pick.outputs.x64_runner }}
      arm64_runner: ${{ steps.pick.outputs.arm64_runner }}
      windows_runner: ${{ steps.pick.outputs.windows_runner }}
    steps:
      - name: Check self-hosted runner status
        id: pick
        shell: pwsh
        run: |
          $x64Runner = '["ubuntu-latest"]'
          $arm64Runner = '["ubuntu-latest"]'
          $windowsRunner = '["windows-latest"]'
          if ($env:RUNNER_STATUS_PAT) {
            try {
              $headers = @{
                "Authorization" = "Bearer $env:RUNNER_STATUS_PAT"
                "Accept"        = "application/vnd.github+json"
                "User-Agent"    = "ZFTP-CI"
              }
              $resp = Invoke-RestMethod -Uri "https://api.github.com/orgs/${{ github.repository_owner }}/actions/runners?per_page=100" -Headers $headers
              # "busy" (mid-job) is still fine to target - it'll just run next.
              # Only "offline" means the job would queue forever - fall back then.
              $online = $resp.runners | Where-Object { $_.status -eq "online" }
              $onlineLinux = $online | Where-Object { $_.os -eq "linux" }
              $x64   = $onlineLinux | Where-Object { $_.labels.name -contains "X64" }   | Select-Object -First 1
              $arm64 = $onlineLinux | Where-Object { $_.labels.name -contains "ARM64" } | Select-Object -First 1
              $win   = $online | Where-Object { $_.os -eq "windows" } | Select-Object -First 1
              if ($x64)   { $x64Runner     = '["self-hosted","Linux","X64"]' }
              if ($arm64) { $arm64Runner   = '["self-hosted","Linux","ARM64"]' }
              if ($win)   { $windowsRunner = '["self-hosted","Windows"]' }
              Write-Output "Online self-hosted runners: $($online.name -join ', ')"
            } catch {
              Write-Warning "Couldn't query self-hosted runner status ($_) - falling back to GitHub-hosted runners."
            }
          } else {
            Write-Warning "RUNNER_STATUS_PAT secret not set - falling back to GitHub-hosted runners."
          }
          Write-Output "x64 runner: $x64Runner"
          Write-Output "arm64 runner: $arm64Runner"
          Write-Output "windows runner: $windowsRunner"
          "x64_runner=$x64Runner" >> $env:GITHUB_OUTPUT
          "arm64_runner=$arm64Runner" >> $env:GITHUB_OUTPUT
          "windows_runner=$windowsRunner" >> $env:GITHUB_OUTPUT
        env:
          RUNNER_STATUS_PAT: ${{ secrets.RUNNER_STATUS_PAT }}

  build:
    needs: [detect-runners]
    name: Build (${{ matrix.artifact }})
    # runs-on is resolved from the matrix: every leg pulls its runner from
    # detect-runners (self-hosted if a matching box is online, else the
    # GitHub-hosted fallback).
    runs-on: ${{ fromJson(matrix.runner) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact: windows
            os_family: windows
            arch: x64
            runner: ${{ needs.detect-runners.outputs.windows_runner }}
          - artifact: linux-x64
            os_family: linux
            arch: x64
            runner: ${{ needs.detect-runners.outputs.x64_runner }}
          - artifact: linux-arm64
            os_family: linux
            arch: arm64
            runner: ${{ needs.detect-runners.outputs.arm64_runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Linux needs extra libs for some native deps / AppImage packaging.
      # On self-hosted runners these are usually pre-installed; apt-get is a
      # cheap no-op if so.
      - name: Install Linux build deps
        if: matrix.os_family == 'linux'
        run: sudo apt-get update && sudo apt-get install -y rpm fakeroot dpkg libudev-dev

      - name: Install dependencies
        run: npm install

      # OPTIONAL self-hosted-only patch. runner.environment is 'self-hosted'
      # only when one of our own runners was online and picked up this job
      # ("if online"); on the GitHub-hosted fallback it's 'github-hosted' and
      # this step is skipped. Put the global sed substitution here.
      - name: Self-hosted patch (sed global)
        if: runner.environment == 'self-hosted'
        run: |
          echo "Running on self-hosted runner - applying patch."
          # TODO: replace with your actual global sed, e.g.:
          # sed -i 's|OLD|NEW|g' path/to/file

      # Builds the standalone update helper (updater/) for this OS and
      # normalizes its output to a fixed, predictable path/name so the main
      # app's extraFiles/extraResources config (package.json) doesn't need
      # to know electron-builder's exact per-arch output folder naming.
      - name: Build updater helper
        working-directory: updater
        run: npm install

      - name: Build updater helper (Windows)
        if: matrix.os_family == 'windows'
        working-directory: updater
        run: |
          npx electron-builder --win --publish never
          Copy-Item "dist\updater.exe" "updater.exe" -Force
        shell: pwsh

      - name: Build updater helper (Linux)
        if: matrix.os_family == 'linux'
        working-directory: updater
        run: |
          npx electron-builder --linux dir --${{ matrix.arch }} --publish never
          BIN_DIR=$(find dist -maxdepth 1 -iname '*-unpacked' | head -1)
          rm -rf linux-unpacked
          cp -R "$BIN_DIR" linux-unpacked

      - name: Build app (Windows)
        if: matrix.os_family == 'windows'
        run: npx electron-builder --win --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build app (Linux)
        if: matrix.os_family == 'linux'
        run: npx electron-builder --linux --${{ matrix.arch }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NekoSuneAPPSVRC-${{ matrix.artifact }}
          retention-days: 14
          path: |
            dist/*.exe
            dist/*.msi
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: ignore

  release:
    name: Publish release
    needs: [detect-runners, build]
    # Publish on ANY tag (v1.0.7 or 1.0.7). !cancelled() lets the release run and
    # attach whatever built even if one OS/arch leg failed.
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/') }}
    # Uses the detected Linux x64 runner (self-hosted vmi555990 if online, else
    # ubuntu-latest). NOTE: this job relies on gh, jq, curl and awk - present on
    # GitHub-hosted ubuntu, but make sure they're installed on the self-hosted
    # X64 box too, or the VirusTotal/Discord/changelog steps will fail there.
    runs-on: ${{ fromJson(needs.detect-runners.outputs.x64_runner) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Scans the Windows installers with VirusTotal and links the reports in
      # the release notes, so "installers are unsigned" doesn't have to be
      # taken on faith. Skips cleanly (no report section at all) if the
      # VT_API_KEY repo secret isn't set - a free key from
      # https://www.virustotal.com/gui/my-apikey, added under
      # Settings -> Secrets and variables -> Actions.
      - name: Scan installers with VirusTotal
        id: vtscan
        run: |
          : > vt-notes.md
          if [ -z "${VT_API_KEY:-}" ]; then
            echo "No VT_API_KEY secret set - skipping VirusTotal scan."
            exit 0
          fi
          echo "## 🛡️ VirusTotal" >> vt-notes.md
          shopt -s nullglob
          files=(artifacts/NekoSuneAPPSVRC-windows/*.exe artifacts/NekoSuneAPPSVRC-windows/*.msi artifacts/NekoSuneAPPSVRC-windows/*.zip)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No Windows installers found to scan." >> vt-notes.md
            exit 0
          fi
          for f in "${files[@]}"; do
            name=$(basename "$f")
            echo "Scanning $name..."
            size=$(stat -c%s "$f")
            if [ "$size" -gt 33554432 ]; then
              upload_url=$(curl -sS -H "x-apikey: $VT_API_KEY" https://www.virustotal.com/api/v3/files/upload_url | jq -r '.data')
            else
              upload_url="https://www.virustotal.com/api/v3/files"
            fi
            resp=$(curl -sS -X POST "$upload_url" -H "x-apikey: $VT_API_KEY" -F "file=@$f")
            analysis_id=$(echo "$resp" | jq -r '.data.id // empty')
            if [ -z "$analysis_id" ]; then
              echo "- **$name**: could not submit to VirusTotal" >> vt-notes.md
              continue
            fi
            status="queued"
            for i in $(seq 1 20); do
              sleep 15
              status_resp=$(curl -sS -H "x-apikey: $VT_API_KEY" "https://www.virustotal.com/api/v3/analyses/$analysis_id")
              status=$(echo "$status_resp" | jq -r '.data.attributes.status // "unknown"')
              [ "$status" = "completed" ] && break
            done
            if [ "$status" != "completed" ]; then
              echo "- **$name**: scan still in progress — [check status](https://www.virustotal.com/gui/file-analysis/$analysis_id)" >> vt-notes.md
              continue
            fi
            malicious=$(echo "$status_resp" | jq -r '.data.attributes.stats.malicious // 0')
            suspicious=$(echo "$status_resp" | jq -r '.data.attributes.stats.suspicious // 0')
            harmless=$(echo "$status_resp" | jq -r '.data.attributes.stats.harmless // 0')
            undetected=$(echo "$status_resp" | jq -r '.data.attributes.stats.undetected // 0')
            total=$((malicious + suspicious + harmless + undetected))
            flagged=$((malicious + suspicious))
            echo "- **$name**: $flagged/$total engines flagged something — [full report](https://www.virustotal.com/gui/file-analysis/$analysis_id)" >> vt-notes.md
          done
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        continue-on-error: true

      - name: Build release notes from CHANGELOG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Extracting CHANGELOG notes for $VERSION"
          # Pull the section for this version (everything between its ## [x.y.z] header
          # and the next ## [ header) — gives the What's Added / Changed / Fixed lists.
          awk -v ver="$VERSION" '
            $0 ~ ("^## \\[" ver "\\]") { grab=1; next }
            grab && /^## \[/ { exit }
            grab { print }
          ' CHANGELOG.md > NOTES.md
          if [ ! -s NOTES.md ]; then printf "Release %s of NekoSuneAPPSVRC.\n" "$VERSION" > NOTES.md; fi
          {
            printf "\n---\n## 📦 Downloads\n"
            printf -- "- **Windows:** \`NekoSuneAPPSVRC-Setup-%s.exe\` (installer), \`NekoSuneAPPSVRC-Portable-%s.exe\`, or \`.zip\`\n" "$VERSION" "$VERSION"
            printf -- "- **Linux (x64):** \`.AppImage\` / \`.deb\`\n"
            printf -- "- **Linux (arm64):** \`.AppImage\` / \`.deb\`\n"
            printf -- "\n> Installers are unsigned, so Windows SmartScreen may warn on first run — click *More info → Run anyway*.\n"
            if [ -s vt-notes.md ]; then printf "\n"; cat vt-notes.md; fi
          } >> NOTES.md
          echo "----- release notes -----"; cat NOTES.md
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          body_path: NOTES.md
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Posts a Discord announcement for the new release, with the changelog notes
      # and direct download links for whatever installers actually got built. The
      # webhook URL lives in the DISCORD_WEBHOOK_URL repo secret (Settings -> Secrets
      # and variables -> Actions) so it's never hardcoded here - skips cleanly (no
      # post at all) if that secret isn't set.
      - name: Notify Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "${DISCORD_WEBHOOK_URL:-}" ]; then
            echo "No DISCORD_WEBHOOK_URL secret set - skipping Discord notification."
            exit 0
          fi

          VERSION="${GITHUB_REF_NAME#v}"
          RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}"
          ICON_URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/assets/logo.png"

          # Release notes body, trimmed to fit under Discord's 4096-char embed description limit
          DESC=$(cat NOTES.md)
          if [ "${#DESC}" -gt 3500 ]; then
            DESC="${DESC:0:3500}"$'\n\n…continued — [see the full release notes]('"$RELEASE_URL"').'
          fi

          # Build a Downloads field from whatever assets actually got attached to the
          # release (so a partial build - e.g. one leg failed - doesn't dead-link).
          # arm64 patterns come first so arch-specific labels win over the generic ones.
          DOWNLOADS=""
          while IFS=$'\t' read -r name url; do
            case "$name" in
              *.exe)              label="🪟 Windows Installer (.exe)" ;;
              *.msi)              label="🪟 Windows Installer (.msi)" ;;
              *.zip)              label="🪟 Windows App ZIP" ;;
              *arm64*.AppImage)   label="🐧 Linux ARM64 (.AppImage)" ;;
              *aarch64*.AppImage) label="🐧 Linux ARM64 (.AppImage)" ;;
              *arm64*.deb)        label="🐧 Linux ARM64 (.deb)" ;;
              *.AppImage)         label="🐧 Linux x64 (.AppImage)" ;;
              *.deb)              label="🐧 Linux x64 (.deb)" ;;
              *)                  continue ;;
            esac
            DOWNLOADS="${DOWNLOADS}[${label}](${url})"$'\n'
          done < <(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[] | [.name, .url] | @tsv')

          if [ -z "$DOWNLOADS" ]; then DOWNLOADS="_No build assets were attached to this release._"; fi

          PAYLOAD=$(jq -n \
            --arg username "NekoSuneAPPSVRC Release" \
            --arg avatar "$ICON_URL" \
            --arg title "NekoSuneAPPSVRC v${VERSION}" \
            --arg url "$RELEASE_URL" \
            --arg desc "$DESC" \
            --arg downloads "$DOWNLOADS" \
            --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              username: $username,
              avatar_url: $avatar,
              embeds: [{
                title: $title,
                url: $url,
                description: $desc,
                color: 9055202,
                fields: [{ name: "📦 Downloads", value: $downloads, inline: false }],
                footer: { text: "NekoSuneAPPSVRC", icon_url: $avatar },
                timestamp: $ts
              }]
            }')

          curl -sS -H "Content-Type: application/json" -X POST -d "$PAYLOAD" "$DISCORD_WEBHOOK_URL"
