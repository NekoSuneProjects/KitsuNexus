name: Build NekoSuneAPPS

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# softprops/action-gh-release needs write access to create the release + upload assets.
permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.artifact }})
    # This repo is built on one AMD64 Ubuntu self-hosted node only. Windows
    # artifacts are cross-built on Linux with Wine/NSIS support, and Linux ARM64
    # artifacts are Electron Builder cross-builds from the same x64 host.
    # Latest Node 24-based official actions require a runner >= 2.327.1; the
    # provided runner logs show 2.336.0, which satisfies that requirement.
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact: win-x64
            os_family: windows
            arch: x64
            builder_args: --win --x64
          - artifact: linux-x64
            os_family: linux
            arch: x64
            builder_args: --linux --x64
          - artifact: linux-arm64
            os_family: linux
            arch: arm64
            builder_args: --linux --arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            updater/package-lock.json

      - name: Cache Electron downloads
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: ${{ runner.os }}-electron-${{ matrix.artifact }}-${{ hashFiles('package-lock.json', 'updater/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-${{ matrix.artifact }}-
            ${{ runner.os }}-electron-

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils \
            ca-certificates \
            curl \
            dpkg \
            fakeroot \
            jq \
            libarchive-tools \
            libudev-dev \
            p7zip-full \
            rpm \
            wine64

      - name: Install NSIS when available
        run: |
          sudo apt-get install -y --no-install-recommends nsis || \
            echo "NSIS package was not available from apt; electron-builder will use its downloaded NSIS toolchain if needed."

      - name: Install dependencies
        run: npm ci

      # OPTIONAL self-hosted-only patch. Put any machine-specific sed substitution here.
      - name: Self-hosted patch (sed global)
        if: runner.environment == 'self-hosted'
        run: |
          echo "Running on the AMD64 Ubuntu self-hosted runner - no patch configured."
          # TODO: replace with your actual global sed, e.g.:
          # sed -i 's|OLD|NEW|g' path/to/file

      - name: Install updater dependencies
        working-directory: updater
        run: npm ci

      - name: Build updater helper (Windows on Linux)
        if: matrix.os_family == 'windows'
        working-directory: updater
        run: |
          npx electron-builder --win --x64 --publish never
          cp dist/updater.exe updater.exe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_CACHE: ~/.cache/electron
          ELECTRON_BUILDER_CACHE: ~/.cache/electron-builder

      - name: Build updater helper (Linux)
        if: matrix.os_family == 'linux'
        working-directory: updater
        run: |
          npx electron-builder --linux dir --${{ matrix.arch }} --publish never
          BIN_DIR=$(find dist -maxdepth 1 -iname '*-unpacked' | head -1)
          test -n "$BIN_DIR"
          rm -rf linux-unpacked
          cp -R "$BIN_DIR" linux-unpacked
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_CACHE: ~/.cache/electron
          ELECTRON_BUILDER_CACHE: ~/.cache/electron-builder

      - name: Build app
        run: npx electron-builder ${{ matrix.builder_args }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_CACHE: ~/.cache/electron
          ELECTRON_BUILDER_CACHE: ~/.cache/electron-builder

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: NekoSuneAPPS-${{ matrix.artifact }}
          retention-days: 14
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/*.tar.gz
            dist/*.blockmap
            dist/latest*.yml
          if-no-files-found: error

  release:
    name: Publish release
    needs: [build]
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/') }}
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Scan installers with VirusTotal
        id: vtscan
        run: |
          : > vt-notes.md
          if [ -z "${VT_API_KEY:-}" ]; then
            echo "No VT_API_KEY secret set - skipping VirusTotal scan."
            exit 0
          fi
          echo "## 🛡️ VirusTotal" >> vt-notes.md
          shopt -s nullglob
          files=(artifacts/NekoSuneAPPS-win-x64/*.exe)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No Windows installers found to scan." >> vt-notes.md
            exit 0
          fi
          for f in "${files[@]}"; do
            name=$(basename "$f")
            echo "Scanning $name..."
            size=$(stat -c%s "$f")
            if [ "$size" -gt 33554432 ]; then
              upload_url=$(curl -sS -H "x-apikey: $VT_API_KEY" https://www.virustotal.com/api/v3/files/upload_url | jq -r '.data')
            else
              upload_url="https://www.virustotal.com/api/v3/files"
            fi
            resp=$(curl -sS -X POST "$upload_url" -H "x-apikey: $VT_API_KEY" -F "file=@$f")
            analysis_id=$(echo "$resp" | jq -r '.data.id // empty')
            if [ -z "$analysis_id" ]; then
              echo "- **$name**: could not submit to VirusTotal" >> vt-notes.md
              continue
            fi
            status="queued"
            for i in $(seq 1 20); do
              sleep 15
              status_resp=$(curl -sS -H "x-apikey: $VT_API_KEY" "https://www.virustotal.com/api/v3/analyses/$analysis_id")
              status=$(echo "$status_resp" | jq -r '.data.attributes.status // "unknown"')
              [ "$status" = "completed" ] && break
            done
            if [ "$status" != "completed" ]; then
              echo "- **$name**: scan still in progress — [check status](https://www.virustotal.com/gui/file-analysis/$analysis_id)" >> vt-notes.md
              continue
            fi
            malicious=$(echo "$status_resp" | jq -r '.data.attributes.stats.malicious // 0')
            suspicious=$(echo "$status_resp" | jq -r '.data.attributes.stats.suspicious // 0')
            harmless=$(echo "$status_resp" | jq -r '.data.attributes.stats.harmless // 0')
            undetected=$(echo "$status_resp" | jq -r '.data.attributes.stats.undetected // 0')
            total=$((malicious + suspicious + harmless + undetected))
            flagged=$((malicious + suspicious))
            echo "- **$name**: $flagged/$total engines flagged something — [full report](https://www.virustotal.com/gui/file-analysis/$analysis_id)" >> vt-notes.md
          done
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        continue-on-error: true

      - name: Build release notes from CHANGELOG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Extracting CHANGELOG notes for $VERSION"
          awk -v ver="$VERSION" '
            $0 ~ ("^## \\[" ver "\\]") { grab=1; next }
            grab && /^## \[/ { exit }
            grab { print }
          ' CHANGELOG.md > NOTES.md
          if [ ! -s NOTES.md ]; then printf "Release %s of NekoSuneAPPS.\n" "$VERSION" > NOTES.md; fi
          {
            printf "\n---\n## 📦 Downloads\n"
            printf -- "- **Windows x64:** portable \\.exe plus NSIS setup \\.exe when supported by Electron Builder/Wine.\n"
            printf -- "- **Linux x64:** \\.AppImage and \\.tar.gz.\n"
            printf -- "- **Linux arm64:** \\.AppImage and \\.tar.gz.\n"
            printf -- "\n> Installers are unsigned, so Windows SmartScreen may warn on first run — click *More info → Run anyway*.\n"
            if [ -s vt-notes.md ]; then printf "\n"; cat vt-notes.md; fi
          } >> NOTES.md
          echo "----- release notes -----"; cat NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          body_path: NOTES.md
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "${DISCORD_WEBHOOK_URL:-}" ]; then
            echo "No DISCORD_WEBHOOK_URL secret set - skipping Discord notification."
            exit 0
          fi

          VERSION="${GITHUB_REF_NAME#v}"
          RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}"
          ICON_URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/assets/logo.png"

          DESC=$(cat NOTES.md)
          if [ "${#DESC}" -gt 3500 ]; then
            DESC="${DESC:0:3500}"$'\n\n…continued — [see the full release notes]('"$RELEASE_URL"').'
          fi

          DOWNLOADS=""
          while IFS=$'\t' read -r name url; do
            case "$name" in
              *Setup*x64*.exe)    label="🪟 Windows x64 NSIS installer (.exe)" ;;
              *x64*.exe)          label="🪟 Windows x64 portable (.exe)" ;;
              *arm64*.AppImage)   label="🐧 Linux ARM64 (.AppImage)" ;;
              *arm64*.tar.gz)     label="🐧 Linux ARM64 (.tar.gz)" ;;
              *x64*.AppImage)     label="🐧 Linux x64 (.AppImage)" ;;
              *x64*.tar.gz)       label="🐧 Linux x64 (.tar.gz)" ;;
              *)                  continue ;;
            esac
            DOWNLOADS="${DOWNLOADS}[${label}](${url})"$'\n'
          done < <(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[] | [.name, .url] | @tsv')

          if [ -z "$DOWNLOADS" ]; then DOWNLOADS="_No build assets were attached to this release._"; fi

          PAYLOAD=$(jq -n \
            --arg username "NekoSuneAPPS Release" \
            --arg avatar "$ICON_URL" \
            --arg title "NekoSuneAPPS v${VERSION}" \
            --arg url "$RELEASE_URL" \
            --arg desc "$DESC" \
            --arg downloads "$DOWNLOADS" \
            --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              username: $username,
              avatar_url: $avatar,
              embeds: [{
                title: $title,
                url: $url,
                description: $desc,
                color: 9055202,
                fields: [{ name: "📦 Downloads", value: $downloads, inline: false }],
                footer: { text: "NekoSuneAPPS", icon_url: $avatar },
                timestamp: $ts
              }]
            }')

          curl -sS -H "Content-Type: application/json" -X POST -d "$PAYLOAD" "$DISCORD_WEBHOOK_URL"
