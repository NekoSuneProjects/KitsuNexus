name: Build KitsuNexus

on:
  workflow_dispatch:
    inputs:
      runner_type:
        description: 'Runner pool (self-hosted Windows builds need a Windows runner)'
        type: choice
        required: true
        default: github-hosted
        options:
          - github-hosted
          - self-hosted
      build_target:
        description: 'Platforms to build (Linux-only avoids requiring a Windows runner)'
        type: choice
        required: true
        default: all
        options:
          - all
          - windows
          - linux
          - linux-x64
          - linux-arm64
      upload_artifacts:
        description: 'Keep build downloads in Actions for 1 day (automatic for releases)'
        type: boolean
        required: true
        default: false
      publish_release:
        description: 'Publish the installers to a GitHub Release and notify Discord'
        type: boolean
        required: true
        default: false
      release_tag:
        description: 'Version (e.g. v1.0.79); auto-creates tag; required when publishing'
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  prepare:
    name: Resolve release version
    # Create tags before any build tries to check them out. GitHub-hosted
    # runners and the existing neko-lite runner both have GitHub CLI.
    runs-on: ${{ inputs.runner_type == 'self-hosted' && fromJSON('["self-hosted","Linux","neko-lite"]') || 'ubuntu-24.04' }}
    permissions:
      contents: write
    outputs:
      checkout_ref: ${{ steps.resolve.outputs.checkout_ref }}
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Validate version and create tag if missing
        id: resolve
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          requested="${REQUESTED_TAG}"
          if [[ -z "$requested" ]]; then
            if [[ "$PUBLISH_RELEASE" == "true" ]]; then
              echo 'Enter a release version (for example v1.0.79) to publish.' >&2
              exit 1
            fi
            echo "checkout_ref=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          version="${requested#v}"
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $requested (expected 1.2.3 or v1.2.3)" >&2
            exit 1
          fi
          tag="v$version"

          # Matching-refs returns an empty list if the tag is missing.
          # Never overwrite or move an existing release tag.
          refs=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$tag" --jq '.[].ref')
          existing=$(printf '%s\n' "$refs" | grep -Fx "refs/tags/$tag" || true)
          if [[ -z "$existing" ]]; then
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA" > /dev/null
            echo "Created $tag at $GITHUB_SHA"
          else
            echo "Reusing existing $tag"
          fi
          echo "checkout_ref=refs/tags/$tag" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.platform }})
    needs: [prepare]
    # GitHub-hosted jobs use native Windows/x64, Linux/x64 and Linux/ARM64.
    # Self-hosted Windows requires a registered Windows runner; neko-build
    # cross-builds both Linux architectures, as in the previous workflow.
    runs-on: ${{ inputs.runner_type == 'self-hosted' && fromJSON(matrix.platform == 'windows' && '["self-hosted","Windows","X64"]' || '["self-hosted","Linux","neko-build"]') || (matrix.platform == 'windows' && 'windows-latest' || matrix.platform == 'linux-arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04') }}
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.build_target == 'all' && '["windows","linux-x64","linux-arm64"]' || inputs.build_target == 'linux' && '["linux-x64","linux-arm64"]' || format('["{0}"]', inputs.build_target)) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # A requested new version can differ from package.json on the selected
      # branch. Stamp the built installers without committing source changes.
      - name: Set build version from release tag
        if: ${{ needs.prepare.outputs.version != '' }}
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: node -e "const fs = require('fs'); const version = process.env.RELEASE_VERSION; for (const file of ['package.json','package-lock.json']) { if (!fs.existsSync(file)) continue; const pkg = JSON.parse(fs.readFileSync(file, 'utf8')); pkg.version = version; if (pkg.packages && pkg.packages['']) pkg.packages[''].version = version; fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + '\n'); }"

      # Linux needs extra libs for some native deps / AppImage packaging.
      # On self-hosted runners these are usually pre-installed; apt-get is a
      # cheap no-op if so.
      - name: Install Linux build deps
        if: startsWith(matrix.platform, 'linux')
        run: sudo apt-get update && sudo apt-get install -y rpm fakeroot dpkg libudev-dev

      # onnxruntime-node (pulled in by @huggingface/transformers for local Whisper STT) tries
      # to download an extra CUDA-enabled GPU runtime from NuGet on Linux by default — that
      # download+extract is large enough to OOM-kill the runner (npm error 137) even though the
      # app only needs the CPU/WASM backend already bundled in the package. Skip it in CI.
      - name: Install dependencies
        run: npm install
        env:
          ONNXRUNTIME_NODE_INSTALL: skip

      # Builds the standalone update helper (updater/) for this OS and
      # normalizes its output to a fixed, predictable path/name so the main
      # app's extraFiles/extraResources config (package.json) doesn't need
      # to know electron-builder's exact per-arch output folder naming.
      - name: Build updater helper
        working-directory: updater
        run: npm install

      - name: Build updater helper (Windows)
        if: matrix.platform == 'windows'
        working-directory: updater
        run: |
          npx electron-builder --win --publish never
          Copy-Item "dist\updater.exe" "updater.exe" -Force
        shell: pwsh

      - name: Build updater helper (Linux)
        if: startsWith(matrix.platform, 'linux')
        working-directory: updater
        run: |
          npx electron-builder --linux dir --${{ matrix.platform == 'linux-arm64' && 'arm64' || 'x64' }} --publish never
          BIN_DIR=$(find dist -maxdepth 1 -iname '*-unpacked' | head -1)
          rm -rf linux-unpacked
          cp -R "$BIN_DIR" linux-unpacked

      - name: Build app (Windows)
        if: matrix.platform == 'windows'
        run: npx electron-builder --win --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build app (Linux)
        if: startsWith(matrix.platform, 'linux')
        run: npx electron-builder --linux --${{ matrix.platform == 'linux-arm64' && 'arm64' || 'x64' }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        if: ${{ inputs.publish_release || inputs.upload_artifacts }}
        uses: actions/upload-artifact@v4
        with:
          name: KitsuNexus-${{ matrix.platform }}
          retention-days: 1
          path: |
            dist/*.exe
            dist/*.msi
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Publish release
    needs: [prepare, build]
    permissions:
      contents: write
    # Publishing is a separate manual choice. The prepare job creates new tags.
    if: ${{ inputs.publish_release }}
    runs-on: ${{ inputs.runner_type == 'self-hosted' && fromJSON('["self-hosted", "Linux", "neko-lite"]') || 'ubuntu-24.04' }}
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Scans the Windows installers with VirusTotal and links the reports in
      # the release notes, so "installers are unsigned" doesn't have to be
      # taken on faith. Skips cleanly (no report section at all) if the
      # VT_API_KEY repo secret isn't set - a free key from
      # https://www.virustotal.com/gui/my-apikey, added under
      # Settings -> Secrets and variables -> Actions.
      - name: Scan installers with VirusTotal
        id: vtscan
        run: |
          : > vt-notes.md
          if [ -z "${VT_API_KEY:-}" ]; then
            echo "No VT_API_KEY secret set - skipping VirusTotal scan."
            exit 0
          fi
          echo "## 🛡️ VirusTotal" >> vt-notes.md
          shopt -s nullglob
          files=(artifacts/KitsuNexus-windows/*.exe artifacts/KitsuNexus-windows/*.msi artifacts/KitsuNexus-windows/*.zip)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No Windows installers found to scan." >> vt-notes.md
            exit 0
          fi
          for f in "${files[@]}"; do
            name=$(basename "$f")
            echo "Scanning $name..."
            size=$(stat -c%s "$f")
            if [ "$size" -gt 33554432 ]; then
              upload_url=$(curl -sS -H "x-apikey: $VT_API_KEY" https://www.virustotal.com/api/v3/files/upload_url | jq -r '.data')
            else
              upload_url="https://www.virustotal.com/api/v3/files"
            fi
            resp=$(curl -sS -X POST "$upload_url" -H "x-apikey: $VT_API_KEY" -F "file=@$f")
            analysis_id=$(echo "$resp" | jq -r '.data.id // empty')
            if [ -z "$analysis_id" ]; then
              echo "- **$name**: could not submit to VirusTotal" >> vt-notes.md
              continue
            fi
            status="queued"
            for i in $(seq 1 20); do
              sleep 15
              status_resp=$(curl -sS -H "x-apikey: $VT_API_KEY" "https://www.virustotal.com/api/v3/analyses/$analysis_id")
              status=$(echo "$status_resp" | jq -r '.data.attributes.status // "unknown"')
              [ "$status" = "completed" ] && break
            done
            if [ "$status" != "completed" ]; then
              echo "- **$name**: scan still in progress — [check status](https://www.virustotal.com/gui/file-analysis/$analysis_id)" >> vt-notes.md
              continue
            fi
            malicious=$(echo "$status_resp" | jq -r '.data.attributes.stats.malicious // 0')
            suspicious=$(echo "$status_resp" | jq -r '.data.attributes.stats.suspicious // 0')
            harmless=$(echo "$status_resp" | jq -r '.data.attributes.stats.harmless // 0')
            undetected=$(echo "$status_resp" | jq -r '.data.attributes.stats.undetected // 0')
            total=$((malicious + suspicious + harmless + undetected))
            flagged=$((malicious + suspicious))
            echo "- **$name**: $flagged/$total engines flagged something — [full report](https://www.virustotal.com/gui/file-analysis/$analysis_id)" >> vt-notes.md
          done
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        continue-on-error: true

      - name: Build release notes from CHANGELOG
        run: |
          VERSION="${RELEASE_TAG#v}"
          echo "Extracting CHANGELOG notes for $VERSION"
          # Pull the section for this version (everything between its ## [x.y.z] header
          # and the next ## [ header) — gives the What's Added / Changed / Fixed lists.
          awk -v ver="$VERSION" '
            $0 ~ ("^## \\[" ver "\\]") { grab=1; next }
            grab && /^## \[/ { exit }
            grab { print }
          ' CHANGELOG.md > NOTES.md
          if [ ! -s NOTES.md ]; then printf "Release %s of KitsuNexus.\n" "$VERSION" > NOTES.md; fi
          {
            printf "\n---\n## 📦 Downloads\n"
            printf -- "- **Windows:** \`KitsuNexus-Setup-%s.exe\` (installer), \`KitsuNexus-Portable-%s.exe\`, or \`.zip\`\n" "$VERSION" "$VERSION"
            printf -- "- **Linux (x64):** \`.AppImage\` / \`.deb\`\n"
            printf -- "- **Linux (arm64):** \`.AppImage\` / \`.deb\`\n"
            printf -- "\n> Installers are unsigned, so Windows SmartScreen may warn on first run — click *More info → Run anyway*.\n"
            if [ -s vt-notes.md ]; then printf "\n"; cat vt-notes.md; fi
          } >> NOTES.md
          echo "----- release notes -----"; cat NOTES.md
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          files: artifacts/**/*
          body_path: NOTES.md
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Posts a Discord announcement for the new release, with the changelog notes
      # and direct download links for whatever installers actually got built. The
      # webhook URL lives in the DISCORD_WEBHOOK_URL repo secret (Settings -> Secrets
      # and variables -> Actions) so it's never hardcoded here - skips cleanly (no
      # post at all) if that secret isn't set.
      - name: Notify Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "${DISCORD_WEBHOOK_URL:-}" ]; then
            echo "No DISCORD_WEBHOOK_URL secret set - skipping Discord notification."
            exit 0
          fi

          VERSION="${RELEASE_TAG#v}"
          RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}"
          ICON_URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/assets/logo.png"

          # Release notes body, trimmed to fit under Discord's 4096-char embed description limit
          DESC=$(cat NOTES.md)
          if [ "${#DESC}" -gt 3500 ]; then
            DESC="${DESC:0:3500}"$'\n\n…continued — [see the full release notes]('"$RELEASE_URL"').'
          fi

          # Build a Downloads field from whatever assets actually got attached to the
          # release (so a partial build - e.g. one leg failed - doesn't dead-link).
          # arm64 patterns come first so arch-specific labels win over the generic ones.
          DOWNLOADS=""
          while IFS=$'\t' read -r name url; do
            case "$name" in
              *.exe)              label="🪟 Windows Installer (.exe)" ;;
              *.msi)              label="🪟 Windows Installer (.msi)" ;;
              *.zip)              label="🪟 Windows App ZIP" ;;
              *arm64*.AppImage)   label="🐧 Linux ARM64 (.AppImage)" ;;
              *aarch64*.AppImage) label="🐧 Linux ARM64 (.AppImage)" ;;
              *arm64*.deb)        label="🐧 Linux ARM64 (.deb)" ;;
              *.AppImage)         label="🐧 Linux x64 (.AppImage)" ;;
              *.deb)              label="🐧 Linux x64 (.deb)" ;;
              *)                  continue ;;
            esac
            DOWNLOADS="${DOWNLOADS}[${label}](${url})"$'\n'
          done < <(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[] | [.name, .url] | @tsv')

          if [ -z "$DOWNLOADS" ]; then DOWNLOADS="_No build assets were attached to this release._"; fi

          PAYLOAD=$(jq -n \
            --arg username "KitsuNexus Release" \
            --arg avatar "$ICON_URL" \
            --arg title "KitsuNexus v${VERSION}" \
            --arg url "$RELEASE_URL" \
            --arg desc "$DESC" \
            --arg downloads "$DOWNLOADS" \
            --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              username: $username,
              avatar_url: $avatar,
              embeds: [{
                title: $title,
                url: $url,
                description: $desc,
                color: 9055202,
                fields: [{ name: "📦 Downloads", value: $downloads, inline: false }],
                footer: { text: "KitsuNexus", icon_url: $avatar },
                timestamp: $ts
              }]
            }')

          curl -sS -H "Content-Type: application/json" -X POST -d "$PAYLOAD" "$DISCORD_WEBHOOK_URL"
