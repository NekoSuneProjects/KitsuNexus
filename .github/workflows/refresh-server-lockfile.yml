name: Refresh dependency lockfile

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Branch to refresh (server, main, release, or beta)'
        required: true
        type: choice
        default: server
        options:
          - server
          - main
          - release
          - beta

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Regenerate lockfile
        run: |
          npm --version
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Validate dependency installation
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Show npm diagnostics on failure
        if: failure()
        shell: bash
        run: |
          for file in $(find "$HOME/.npm/_logs" -maxdepth 1 -name '*debug-0.log' -type f 2>/dev/null | sort | tail -3); do
            echo "::group::npm diagnostic: $file"
            tail -n 120 "$file"
            echo '::endgroup::'
          done
      - name: Run tests
        run: npm test
      - name: Open lockfile fix PR
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already synchronized."
            exit 0
          fi
          branch="fix/${{ inputs.target_branch }}-lockfile-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add package-lock.json
          git commit -m "fix(server): synchronize npm lockfile"
          git push origin "$branch"
          gh pr create --base "${{ inputs.target_branch }}" --head "$branch" --title "fix(${{ inputs.target_branch }}): synchronize npm lockfile" --body "Regenerated package-lock.json from the server package manifest and validated npm ci and tests. Merge after security checks pass, then rerun the server Docker build."
