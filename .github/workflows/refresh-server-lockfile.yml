name: Refresh dependency lockfile

on:
  push:
    branches: [server]
    paths:
      - package.json
      - package-lock.json
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Branch to refresh (server, main, release, or beta)'
        required: true
        type: choice
        default: server
        options:
          - server
          - main
          - release
          - beta

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: server
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Regenerate lockfile
        run: |
          npm --version
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Show npm diagnostics on failure
        if: failure()
        shell: bash
        run: |
          for file in $(find "$HOME/.npm/_logs" -maxdepth 1 -name '*debug-0.log' -type f 2>/dev/null | sort | tail -3); do
            echo "::group::npm diagnostic: $file"
            tail -n 120 "$file"
            echo '::endgroup::'
          done
      - name: Commit refreshed lockfile to server
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix(server): synchronize npm lockfile"
          git push origin HEAD:server
