<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'">
<title>KitsuNexus translation overlay</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; pointer-events: none; }
  .tl {
    position: absolute; transform: translate(-50%, -100%);
    max-width: 46vw; padding: 6px 12px; border-radius: 10px;
    background: rgba(12, 18, 24, 0.88); color: #f2fbff;
    border: 1px solid rgba(143, 211, 255, 0.55); box-shadow: 0 4px 14px rgba(0, 0, 0, 0.45);
    font: 600 20px/1.3 "Segoe UI", system-ui, sans-serif; text-align: center; white-space: pre-wrap;
    transition: opacity .35s ease; text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
  }
  .tl.below { transform: translate(-50%, 0); }
  .tl small { display: block; font-size: 11px; font-weight: 500; color: #8fd3ff; letter-spacing: .04em; margin-bottom: 2px; }
  .tl.fade { opacity: 0; }
</style>
</head>
<body>
<script src="translateOverlay.renderer.js"></script>
</body>
</html>
