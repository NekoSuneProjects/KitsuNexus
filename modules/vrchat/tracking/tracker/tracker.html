<!doctype html>
<html lang="en">
<head>

<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; connect-src 'self'; media-src mediastream: blob:; img-src data: blob:; worker-src 'self' blob:; style-src 'unsafe-inline'">
<title>KitsuNexus Tracker</title>
</head>
<body style="margin:0;background:#000">
<video id="cam" muted playsinline style="width:320px"></video>
<canvas id="preview" width="320" height="240"></canvas>
<script src="../cameraModes.js"></script>
<script type="module" src="tracker.js"></script>
</body>
</html>
